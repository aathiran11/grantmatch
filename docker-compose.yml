services:
  postgres:
    image: postgres:16-alpine
    container_name: grantmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grantmatch
    ports:
      - "5432:5432"
    volumes:
      - grantmatch_pgdata:/var/lib/postgresql/data

volumes:
  grantmatch_pgdata:
